openapi: 3.1.0
info:
  title: API MSPI
  version: '1.20.0'
  description: >-
    La version del contrato se puede consultar sin sesion. Todas las operaciones estan sujetas
    a limites de entrada: 429 DEMASIADAS_SOLICITUDES por direccion, 503 CAPACIDAD_AGOTADA
    por concurrencia, sesiones o tabla de clientes agotadas, y 413 CARGA_DEMASIADO_GRANDE.
    Los rechazos de carga usan Problem, no-store y correlationId; 429/503 de este control
    incluyen Retry-After en segundos. Un presupuesto SQL o pool agotado responde 503 BASE_OCUPADA
    con Retry-After, sin SQL ni credenciales. Las respuestas HEAD no contienen cuerpo.
    Los limites por defecto y su alcance se describen en docs/LIMITES-SOBRECARGA.md.
paths:
  /api/v1:
    get:
      operationId: consultarVersionApi
      summary: Consulta la versión del contrato
      responses:
        '200':
          description: Versión de la API
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersion'
              example:
                version: v1
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    head:
      operationId: consultarCabecerasVersionApi
      summary: Consulta las cabeceras de la versión
      responses:
        '200':
          description: Cabeceras de la respuesta GET
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '406':
          description: Tipo de respuesta no aceptable
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '500':
          description: Error interno
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/csrf:
    get:
      operationId: consultarCsrf
      summary: Obtiene un token CSRF vinculado a la sesión del navegador
      responses:
        '200':
          description: Token CSRF. Si aún no hay sesión, el servidor envía MSPISESSION.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfView'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/sesion:
    post:
      operationId: iniciarSesion
      summary: Autentica una cuenta local y rota la sesión del navegador
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/CurrentSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
      operationId: consultarSesion
      summary: Consulta la identidad de la sesión vigente
      description: >-
        Comprueba vencimiento, existencia de la cuenta, estado HABILITADA y version de credencial.
        Si la cuenta se desactiva, se elimina o cambia su version, rechaza la sesion con
        401 NO_AUTENTICADO. Rehabilitar la cuenta requiere iniciar una nueva sesion.
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/CurrentSession'
        '401':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      operationId: cerrarSesion
      summary: Invalida la sesión vigente en el servidor
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sesión invalidada. El servidor expira la cookie MSPISESSION.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/recuperacion:
    post:
      operationId: solicitarRecuperacion
      summary: Solicita recuperación de acceso con el correo registrado
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '202':
          description: Solicitud admitida sin indicar si existe la cuenta o si se envió un correo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/recuperacion/confirmar:
    post:
      operationId: confirmarRecuperacion
      summary: Restablece la contraseña con un comprobante de un solo uso
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryConfirmation'
      responses:
        '204':
          description: Credencial restablecida y sesiones anteriores invalidadas
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/mis-empresas:
    get:
      operationId: listarMisEmpresas
      summary: Lista las empresas operables de la sesión
      security:
        - sessionCookie: []
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página ordenada por nombre y UUID
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/contexto:
    get:
      operationId: consultarContextoEmpresa
      summary: Consulta la membresía propia y el contexto mínimo de la empresa
      security:
        - sessionCookie: []
      parameters:
        - name: empresaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contexto y roles locales vigentes
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarActivos
      summary: Consulta el inventario local
      description: Requiere AE, GS o AU de la empresa activa. Busca texto literal en código o nombre y admite filtros opcionales.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/CatalogState'
        - $ref: '#/components/parameters/InventorySearch'
        - $ref: '#/components/parameters/InventoryTypeFilter'
        - $ref: '#/components/parameters/InventoryProcessFilter'
      responses:
        '200':
          description: Consulta el inventario local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInventoryPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: crearActivo
      summary: Registra un activo
      description: Requiere AE o GS de la empresa activa. El código se reserva por empresa y se fija al crear.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryAsset'
      responses:
        '201':
          description: Registra un activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    get:
      operationId: consultarActivo
      summary: Consulta un activo local
      description: Requiere AE, GS o AU de la empresa activa. Incluye fichas archivadas.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta un activo local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editarActivo
      summary: Edita un activo vigente
      description: Requiere AE o GS de la empresa activa. Exige revisión y preserva el código original.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditInventoryAsset'
      responses:
        '200':
          description: Edita un activo vigente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/archivar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    post:
      operationId: archivarActivo
      summary: Archiva un activo local
      description: Requiere AE o GS de la empresa activa. Exige motivo y revisión vigente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveInventoryAsset'
      responses:
        '200':
          description: Archiva un activo local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/restaurar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    post:
      operationId: restaurarActivo
      summary: Restaura un activo archivado
      description: Requiere AE o GS de la empresa activa. Revalida todas las referencias y permite proporcionar reemplazos.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreInventoryAsset'
      responses:
        '200':
          description: Restaura un activo archivado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/historial:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    get:
      operationId: consultarHistorialActivo
      summary: Consulta el historial del activo
      description: Solo AE de la empresa activa. Incluye estados, motivo, campos modificados y referencias históricas.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Consulta el historial del activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryHistoryPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/clasificaciones:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    get:
      operationId: listarClasificacionesActivo
      summary: Consulta las versiones de clasificación del activo
      description: Requiere AE, GS o AU. Las versiones se ordenan desde la más reciente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Consulta las versiones de clasificación del activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuationPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: iniciarClasificacionActivo
      summary: Inicia una valoración pendiente
      description: Requiere AE o GS y activo vigente. Una reevaluación exige motivo y conserva la valoración confirmada vigente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAssetValuationInput'
      responses:
        '201':
          description: Inicia una valoración pendiente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/clasificaciones/{valoracionId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
      - $ref: '#/components/parameters/AssetValuationId'
    get:
      operationId: consultarClasificacionActivo
      summary: Consulta una versión de clasificación
      description: Requiere AE, GS o AU de la empresa activa.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta una versión de clasificación
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editarClasificacionActivo
      summary: Reemplaza las entradas de una valoración pendiente
      description: Requiere AE o GS y la revisión vigente. Las valoraciones confirmadas son inmutables.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAssetValuationInput'
      responses:
        '200':
          description: Reemplaza las entradas de una valoración pendiente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/clasificaciones/{valoracionId}/confirmar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
      - $ref: '#/components/parameters/AssetValuationId'
    post:
      operationId: confirmarClasificacionActivo
      summary: Confirma y publica una valoración
      description: Requiere AE o GS, C/I/D completas, fundamento y datos condicionales resueltos. La criticidad se calcula por máximo.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAssetValuationInput'
      responses:
        '200':
          description: Confirma y publica una valoración
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/catalogos:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarCatalogos
      summary: Lista ediciones publicadas de catálogos
      description: Requiere AE, GS o AU de la empresa operable. Incluye ediciones retiradas salvo filtro.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/ReferenceCode'
        - $ref: '#/components/parameters/AvailableForNewUses'
      responses:
        '200':
          description: Lista ediciones publicadas de catálogos
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceCatalogPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/catalogos/{versionId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/ReferenceVersionId'
    get:
      operationId: consultarCatalogo
      summary: Consulta metadatos de una edición
      description: Requiere AE, GS o AU de la empresa operable.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta metadatos de una edición
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceCatalogVersion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/catalogos/{versionId}/elementos:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/ReferenceVersionId'
    get:
      operationId: listarElementosCatalogo
      summary: Lista controles y cláusulas de una edición
      description: Requiere AE, GS o AU de la empresa operable. Filtra por tipo, grupo, código o texto literal.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/ReferenceType'
        - $ref: '#/components/parameters/ReferenceGroup'
        - $ref: '#/components/parameters/ReferenceCode'
        - $ref: '#/components/parameters/ReferenceText'
      responses:
        '200':
          description: Lista controles y cláusulas de una edición
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceElementPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/catalogos/{versionId}/elementos/{elementoId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/ReferenceVersionId'
      - $ref: '#/components/parameters/ReferenceElementId'
    get:
      operationId: consultarElementoCatalogo
      summary: Consulta descripción y origen del elemento
      description: Requiere AE, GS o AU de la empresa operable. El identificador debe pertenecer a la edición solicitada.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta descripción y origen del elemento
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceElement'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/metodologias:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarMetodologias
      summary: Lista versiones publicadas de metodología
      description: Requiere AE, GS o AU de la empresa operable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/ReferenceCode'
        - $ref: '#/components/parameters/AvailableForNewUses'
      responses:
        '200':
          description: Lista versiones publicadas de metodología
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceMethodPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/metodologias/{versionId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/ReferenceVersionId'
    get:
      operationId: consultarMetodologia
      summary: Consulta una versión de metodología
      description: Requiere AE, GS o AU de la empresa operable. Incluye reglas declarativas y referencia de aprobación.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta una versión de metodología
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferenceMethodVersion'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/evaluaciones:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarEvaluaciones
      summary: Lista evaluaciones locales
      description: Requiere AE, GS o AU de la empresa operable.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
