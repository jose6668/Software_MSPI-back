          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEvidencePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: cargarEvidenciaRespuesta
      summary: Adjunta un archivo privado a una respuesta en borrador
      description: Requiere AE o GS, CSRF, revisión vigente y cuota configurada. Publica tras inspección antimalware y validación de formato; la carga exitosa incrementa la revisión de la evaluación.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [archivo, revisionEsperada]
              properties:
                archivo:
                  type: string
                  format: binary
                  description: PDF, PNG o JPEG de hasta 10 000 000 bytes.
                revisionEsperada: {type: integer, format: int64, minimum: 0}
                descripcion: {type: string, maxLength: 1000}
      responses:
        '201':
          description: Evidencia disponible
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
            Location:
              description: Ruta de descarga que exige autorización vigente.
              schema: {type: string, format: uri-reference}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseEvidenceUpload'
        '413':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem' # EVIDENCIA_BLOQUEADA
        '503':
          $ref: '#/components/responses/Problem' # INSPECCION_EVIDENCIAS_NO_DISPONIBLE u otro recurso no disponible
        default:
          $ref: '#/components/responses/Problem'
