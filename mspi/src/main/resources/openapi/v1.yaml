        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformCompany'
    AcceptedInvitation:
      description: Membresía creada con los roles de la invitación
      headers:
        X-Correlation-Id:
