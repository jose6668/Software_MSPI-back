components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MSPISESSION
      description: Cookie HttpOnly del servidor. El POST recibe la cookie previa obtenida al consultar CSRF.
  parameters:
    EvaluationId:
      name: evaluacionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvaluationResponseId:
      name: respuestaId
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvaluationFindingId:
      name: hallazgoId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ControlImplementationId:
      name: implementacionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ControlImplementationVersionId:
      name: versionId
