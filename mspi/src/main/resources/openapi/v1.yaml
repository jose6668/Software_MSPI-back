          format: uuid
        membresiaId:
          type: string
          format: uuid
        usuarioId:
          type: string
          format: uuid
        roles:
          $ref: '#/components/schemas/OfferedRoles'
    CompanyMembership:
      type: object
      additionalProperties: false
      required: [empresaId, nombre, zonaHoraria, roles]
      properties:
        empresaId:
          type: string
          format: uuid
        nombre:
          type: string
        zonaHoraria:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum: [AE, GS, RA, AU]
    CompanyPage:
      type: object
      additionalProperties: false
      required: [empresas, pagina, tamano, hayMas]
      properties:
