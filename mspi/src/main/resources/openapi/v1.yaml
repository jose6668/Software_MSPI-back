openapi: 3.1.0
info:
  title: API MSPI
  version: '1.9.0'
  description: Contrato HTTP inicial. La versión del contrato se puede consultar sin sesión.
paths:
  /api/v1:
    get:
      operationId: consultarVersionApi
      summary: Consulta la versión del contrato
      responses:
        '200':
          description: Versión de la API
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersion'
              example:
                version: v1
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    head:
      operationId: consultarCabecerasVersionApi
      summary: Consulta las cabeceras de la versión
      responses:
        '200':
          description: Cabeceras de la respuesta GET
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '406':
          description: Tipo de respuesta no aceptable
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '500':
          description: Error interno
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
  /api/v1/identidad/csrf:
    get:
      operationId: consultarCsrf
      summary: Obtiene un token CSRF vinculado a la sesión del navegador
      responses:
        '200':
          description: Token CSRF. Si aún no hay sesión, el servidor envía MSPISESSION.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfView'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/sesion:
    post:
      operationId: iniciarSesion
      summary: Autentica una cuenta local y rota la sesión del navegador
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/CurrentSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      operationId: consultarSesion
      summary: Consulta la identidad de la sesión vigente
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/CurrentSession'
        '401':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: cerrarSesion
      summary: Invalida la sesión vigente en el servidor
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sesión invalidada. El servidor expira la cookie MSPISESSION.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/recuperacion:
    post:
      operationId: solicitarRecuperacion
      summary: Solicita recuperación de acceso con el correo registrado
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryRequest'
      responses:
        '202':
          description: Solicitud admitida sin indicar si existe la cuenta o si se envió un correo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/recuperacion/confirmar:
    post:
      operationId: confirmarRecuperacion
      summary: Restablece la contraseña con un comprobante de un solo uso
      security:
        - {}
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecoveryConfirmation'
      responses:
        '204':
          description: Credencial restablecida y sesiones anteriores invalidadas
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/mis-empresas:
    get:
      operationId: listarMisEmpresas
      summary: Lista las empresas operables de la sesión
      security:
        - sessionCookie: []
      parameters:
        - name: pagina
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: tamano
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Página ordenada por nombre y UUID
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyPage'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/contexto:
    get:
      operationId: consultarContextoEmpresa
      summary: Consulta la membresía propia y el contexto mínimo de la empresa
      security:
        - sessionCookie: []
      parameters:
        - name: empresaId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Contexto y roles locales vigentes
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMembership'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarActivos
      summary: Consulta el inventario local
      description: Requiere AE, GS o AU de la empresa activa. Busca texto literal en código o nombre y admite filtros opcionales.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/CatalogState'
        - $ref: '#/components/parameters/InventorySearch'
        - $ref: '#/components/parameters/InventoryTypeFilter'
        - $ref: '#/components/parameters/InventoryProcessFilter'
      responses:
        '200':
          description: Consulta el inventario local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetInventoryPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: crearActivo
      summary: Registra un activo
      description: Requiere AE o GS de la empresa activa. El código se reserva por empresa y se fija al crear.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInventoryAsset'
      responses:
        '201':
          description: Registra un activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    get:
      operationId: consultarActivo
      summary: Consulta un activo local
      description: Requiere AE, GS o AU de la empresa activa. Incluye fichas archivadas.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta un activo local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editarActivo
      summary: Edita un activo vigente
      description: Requiere AE o GS de la empresa activa. Exige revisión y preserva el código original.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditInventoryAsset'
      responses:
        '200':
          description: Edita un activo vigente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/archivar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    post:
      operationId: archivarActivo
      summary: Archiva un activo local
      description: Requiere AE o GS de la empresa activa. Exige motivo y revisión vigente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveInventoryAsset'
      responses:
        '200':
          description: Archiva un activo local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/restaurar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    post:
      operationId: restaurarActivo
      summary: Restaura un activo archivado
      description: Requiere AE o GS de la empresa activa. Revalida todas las referencias y permite proporcionar reemplazos.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreInventoryAsset'
      responses:
        '200':
          description: Restaura un activo archivado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryAsset'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/historial:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    get:
      operationId: consultarHistorialActivo
      summary: Consulta el historial del activo
      description: Solo AE de la empresa activa. Incluye estados, motivo, campos modificados y referencias históricas.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Consulta el historial del activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryHistoryPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/clasificaciones:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
    get:
      operationId: listarClasificacionesActivo
      summary: Consulta las versiones de clasificación del activo
      description: Requiere AE, GS o AU. Las versiones se ordenan desde la más reciente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Consulta las versiones de clasificación del activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuationPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: iniciarClasificacionActivo
      summary: Inicia una valoración pendiente
      description: Requiere AE o GS y activo vigente. Una reevaluación exige motivo y conserva la valoración confirmada vigente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAssetValuationInput'
      responses:
        '201':
          description: Inicia una valoración pendiente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/clasificaciones/{valoracionId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
      - $ref: '#/components/parameters/AssetValuationId'
    get:
      operationId: consultarClasificacionActivo
      summary: Consulta una versión de clasificación
      description: Requiere AE, GS o AU de la empresa activa.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta una versión de clasificación
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editarClasificacionActivo
      summary: Reemplaza las entradas de una valoración pendiente
      description: Requiere AE o GS y la revisión vigente. Las valoraciones confirmadas son inmutables.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAssetValuationInput'
      responses:
        '200':
          description: Reemplaza las entradas de una valoración pendiente
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/activos/{activoId}/clasificaciones/{valoracionId}/confirmar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/InventoryAssetId'
      - $ref: '#/components/parameters/AssetValuationId'
    post:
      operationId: confirmarClasificacionActivo
      summary: Confirma y publica una valoración
      description: Requiere AE o GS, C/I/D completas, fundamento y datos condicionales resueltos. La criticidad se calcula por máximo.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmAssetValuationInput'
      responses:
        '200':
          description: Confirma y publica una valoración
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetValuation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/procesos:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarProcesos
      summary: Lista los procesos de la empresa
      description: Requiere AE, GS o AU de la empresa activa. El filtro responsableId permite revisar referencias antes de archivar.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/CatalogState'
        - $ref: '#/components/parameters/ResponsibleFilter'
      responses:
        '200':
          description: Lista los procesos de la empresa
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProcessPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: crearProceso
      summary: Crea un proceso activo
      description: Requiere AE o GS de la empresa activa. El responsable opcional debe estar activo y pertenecer a la empresa.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBusinessProcess'
      responses:
        '201':
          description: Crea un proceso activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProcess'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/procesos/{procesoId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/BusinessProcessId'
    get:
      operationId: consultarProceso
      summary: Consulta un proceso local
      description: Requiere AE, GS o AU de la empresa activa.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta un proceso local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProcess'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editarProceso
      summary: Actualiza un proceso activo
      description: Requiere AE o GS de la empresa activa. Exige revisión vigente y valida las nuevas referencias.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBusinessProcess'
      responses:
        '200':
          description: Actualiza un proceso activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProcess'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/procesos/{procesoId}/archivar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/BusinessProcessId'
    post:
      operationId: archivarProceso
      summary: Archiva un proceso local
      description: Requiere AE o GS de la empresa activa. Exige revisión vigente y motivo.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCatalogRecord'
      responses:
        '200':
          description: Archiva un proceso local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessProcess'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/responsables-negocio:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarResponsablesNegocio
      summary: Lista responsables de negocio
      description: Requiere AE, GS o AU de la empresa activa.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
        - $ref: '#/components/parameters/CatalogState'
      responses:
        '200':
          description: Lista responsables de negocio
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponsiblePage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: crearResponsableNegocio
      summary: Crea un responsable de negocio activo
      description: Requiere AE o GS de la empresa activa. El vínculo opcional a una membresía local no concede acceso.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBusinessResponsible'
      responses:
        '201':
          description: Crea un responsable de negocio activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponsible'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/responsables-negocio/{responsableId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/BusinessResponsibleId'
    get:
      operationId: consultarResponsableNegocio
      summary: Consulta un responsable de negocio local
      description: Requiere AE, GS o AU de la empresa activa.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta un responsable de negocio local
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponsible'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: editarResponsableNegocio
      summary: Actualiza un responsable de negocio activo
      description: Requiere AE o GS de la empresa activa. Exige revisión vigente.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditBusinessResponsible'
      responses:
        '200':
          description: Actualiza un responsable de negocio activo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponsible'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/responsables-negocio/{responsableId}/archivar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/BusinessResponsibleId'
    post:
      operationId: archivarResponsableNegocio
      summary: Archiva un responsable de negocio
      description: Requiere AE o GS de la empresa activa. Conserva las referencias existentes e impide nuevas asignaciones.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCatalogRecord'
      responses:
        '200':
          description: Archiva un responsable de negocio
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessResponsible'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/configuracion:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: consultarConfiguracion
      summary: Consulta datos básicos y zona horaria
      description: Requiere AE, GS o AU de la empresa activa.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Consulta datos básicos y zona horaria
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyConfiguration'
        default:
          $ref: '#/components/responses/Problem'
    put:
      operationId: actualizarConfiguracion
      summary: Actualiza la configuración básica
      description: Requiere AE y revisión vigente. La zona horaria rige la interpretación de fechas límite futuras. El historial conserva instantes absolutos.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyConfiguration'
      responses:
        '204':
          description: Operación completada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/membresias:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarMembresias
      summary: Lista membresías de la empresa
      description: Solo AE. Incluye membresías revocadas con sus últimos roles asignados.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Lista membresías de la empresa
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyMemberPage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/responsables:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarResponsables
      summary: Lista responsables elegibles
      description: Solo AE, GS o AU. Devuelve identificador de membresía y nombre visible de miembros activos elegibles.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Lista responsables elegibles
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponsiblePage'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/membresias/{membresiaId}/roles:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/CompanyMember'
    put:
      operationId: actualizarRoles
      summary: Reemplaza el conjunto de roles empresariales
      description: Solo AE. Requiere revisión vigente y conserva al menos un AE activo.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyMemberRoles'
      responses:
        '204':
          description: Operación completada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/membresias/{membresiaId}/revocar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - $ref: '#/components/parameters/CompanyMember'
    post:
      operationId: revocarMembresia
      summary: Revoca el acceso de una membresía
      description: Solo AE. Requiere revisión vigente y conserva al menos un AE activo.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeCompanyMember'
      responses:
        '204':
          description: Operación completada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/invitaciones:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: listarInvitaciones
      summary: Lista invitaciones de la empresa
      description: Solo AE. Incluye fechas y estado derivado. El comprobante queda fuera de la proyección.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CompanyPage'
        - $ref: '#/components/parameters/CompanyPageSize'
      responses:
        '200':
          description: Lista invitaciones de la empresa
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInvitationPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: emitirInvitacion
      summary: Emite y envía por correo una invitación de la empresa
      description: Requiere AE de la empresa y la función de invitaciones habilitada.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueInvitation'
      responses:
        '201':
          description: Invitación enviada al relay SMTP
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedInvitation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/empresas/{empresaId}/invitaciones/{invitacionId}/revocar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
      - name: invitacionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: revocarInvitacion
      summary: Revoca una invitación pendiente
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Invitación revocada
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/invitaciones/aceptar:
    post:
      operationId: aceptarInvitacion
      summary: Acepta con la cuenta verificada del destinatario
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitation'
      responses:
        '201':
          $ref: '#/components/responses/AcceptedInvitation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/invitaciones/alta:
    post:
      operationId: aceptarInvitacionConAlta
      summary: Crea cuenta y membresía con una invitación vigente
      description: La cookie y el token CSRF se obtienen con una sesión anónima. El enlace verifica el correo.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollInvitation'
      responses:
        '201':
          $ref: '#/components/responses/AcceptedInvitation'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/plataforma/empresas:
    get:
      operationId: listarEmpresasPlataforma
      summary: Lista metadatos de plataforma para AP
      security:
        - sessionCookie: []
      parameters:
        - name: pagina
          in: query
          schema: {type: integer, minimum: 0, default: 0}
        - name: tamano
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Página de metadatos del servicio
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformCompanyPage'
        default:
          $ref: '#/components/responses/Problem'
    post:
      operationId: reservarEmpresa
      summary: Reserva una empresa en preparación
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
        - name: Idempotency-Key
          in: header
          required: true
          description: Reutilizar el UUID para reintentar la misma reserva.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveCompany'
      responses:
        '201':
          $ref: '#/components/responses/PlatformCompany'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/plataforma/empresas/{empresaId}:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    get:
      operationId: consultarEmpresaPlataforma
      summary: Consulta metadatos y progreso técnico
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/PlatformCompany'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/plataforma/empresas/{empresaId}/activar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    post:
      operationId: activarEmpresa
      summary: Activa una empresa verificada y envía la primera invitación de AE
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/PlatformRevision'
      responses:
        '200':
          $ref: '#/components/responses/PlatformCompany'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/plataforma/empresas/{empresaId}/invitacion-inicial/reemitir:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    post:
      operationId: reemitirInvitacionInicial
      summary: Reemite el primer enlace antes de su aceptación
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/PlatformRevision'
      responses:
        '200':
          $ref: '#/components/responses/PlatformCompany'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/plataforma/empresas/{empresaId}/suspender:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    post:
      operationId: suspenderEmpresa
      summary: Suspende el acceso empresarial
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/PlatformStateChange'
      responses:
        '200':
          $ref: '#/components/responses/PlatformCompany'
        default:
          $ref: '#/components/responses/Problem'
  /api/v1/plataforma/empresas/{empresaId}/reactivar:
    parameters:
      - $ref: '#/components/parameters/InvitationCompany'
    post:
      operationId: reactivarEmpresa
      summary: Reactiva una empresa suspendida con estructura compatible
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        $ref: '#/components/requestBodies/PlatformStateChange'
      responses:
        '200':
          $ref: '#/components/responses/PlatformCompany'
        default:
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MSPISESSION
      description: Cookie HttpOnly del servidor. El POST recibe la cookie previa obtenida al consultar CSRF.
  parameters:
    AssetValuationId:
      name: valoracionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InventoryAssetId:
      name: activoId
      in: path
      required: true
      schema: {type: string, format: uuid}
    InventorySearch:
      name: texto
      in: query
      schema: {type: string, maxLength: 250}
    InventoryTypeFilter:
      name: tipo
      in: query
      schema: {type: string, enum: [INFORMACION, HARDWARE, SOFTWARE, SERVICIO, RECURSO_HUMANO, INSTALACION, RED]}
    InventoryProcessFilter:
      name: procesoId
      in: query
      schema: {type: string, format: uuid}
    BusinessProcessId:
      name: procesoId
      in: path
      required: true
      schema: {type: string, format: uuid}
    BusinessResponsibleId:
      name: responsableId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CatalogState:
      name: estado
      in: query
      schema: {type: string, enum: [ACTIVO, ARCHIVADO]}
    ResponsibleFilter:
      name: responsableId
      in: query
      schema: {type: string, format: uuid}
    CompanyMember:
      name: membresiaId
      in: path
      required: true
      schema: {type: string, format: uuid}
    CompanyPage:
      name: pagina
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    CompanyPageSize:
      name: tamano
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    InvitationCompany:
      name: empresaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CsrfHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      description: Token obtenido con GET /api/v1/identidad/csrf para esta sesión.
      schema:
        type: string
  headers:
    CorrelationId:
      description: UUID generado por el servidor para esta solicitud
      required: true
      schema:
        type: string
        format: uuid
  responses:
    PlatformCompany:
      description: Metadatos de plataforma de la empresa
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PlatformCompany'
    AcceptedInvitation:
      description: Membresía creada con los roles de la invitación
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AcceptedInvitation'
    CurrentSession:
      description: Identidad y vencimiento absoluto de la sesión vigente
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionView'
    Problem:
      description: Error HTTP con código estable y correlación
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  requestBodies:
    PlatformRevision:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [revisionEsperada]
            properties:
              revisionEsperada: {type: integer, format: int64, minimum: 1}
    PlatformStateChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [revisionEsperada, motivo]
            properties:
              revisionEsperada: {type: integer, format: int64, minimum: 1}
              motivo: {type: string, minLength: 1, maxLength: 1000}
  schemas:
    AssetValuationEntries:
      type: object
      additionalProperties: false
      properties:
        confidencialidad: {type: [integer, 'null'], enum: [1, 3, 5, null]}
        integridad: {type: [integer, 'null'], enum: [1, 3, 5, null]}
        disponibilidad: {type: [integer, 'null'], enum: [1, 3, 5, null]}
        fundamento: {type: [string, 'null']}
        contieneDatosPersonales: {type: [boolean, 'null']}
        contieneDatosMenores: {type: [boolean, 'null']}
        tiposDatosPersonales: {type: [array, 'null'], maxItems: 6, uniqueItems: true, items: {type: string, enum: [IDENTIFICACION, CONTACTO, FINANCIEROS, SALUD, BIOMETRICOS, OTROS]}}
        finalidadTratamiento: {type: [string, 'null']}
        autorizacionTratamiento: {type: [string, 'null'], enum: [SI, 'NO', NO_APLICA, null]}
        justificacionNoAplica: {type: [string, 'null'], maxLength: 2000}
    StartAssetValuationInput:
      type: object
      additionalProperties: false
      required: [entradas]
      properties:
        entradas: {$ref: '#/components/schemas/AssetValuationEntries'}
        motivoRevision: {type: [string, 'null'], maxLength: 1000}
    EditAssetValuationInput:
      type: object
      additionalProperties: false
      required: [entradas, revisionEsperada]
      properties:
        entradas: {$ref: '#/components/schemas/AssetValuationEntries'}
        revisionEsperada: {type: integer, format: int64, minimum: 0}
    ConfirmAssetValuationInput:
      type: object
      additionalProperties: false
      required: [revisionEsperada]
      properties:
        revisionEsperada: {type: integer, format: int64, minimum: 0}
    AssetValuation:
      type: object
      additionalProperties: false
      required: [valoracionId, activoId, numero, revision, metodologia, versionTiposDatos, estado, vigente, criticidad, nivel, entradas, motivoRevision, creadaPor, creadaEn, actualizadaPor, actualizadaEn, confirmadaPor, confirmadaEn]
      properties:
        valoracionId: {type: string, format: uuid}
        activoId: {type: string, format: uuid}
        numero: {type: integer, minimum: 1}
        revision: {type: integer, format: int64, minimum: 0}
        metodologia: {type: string, const: CID_MAX_V1}
        versionTiposDatos: {type: string, const: DATOS_PERSONALES_V1}
        estado: {type: string, enum: [PENDIENTE, COMPLETO]}
        vigente: {type: boolean}
        criticidad: {type: [integer, 'null'], enum: [1, 3, 5, null]}
        nivel: {type: [string, 'null'], enum: [BAJA, MEDIA, ALTA, null]}
        entradas: {$ref: '#/components/schemas/AssetValuationEntries'}
        motivoRevision: {type: [string, 'null']}
        creadaPor: {type: string, format: uuid}
        creadaEn: {type: string, format: date-time}
        actualizadaPor: {type: string, format: uuid}
        actualizadaEn: {type: string, format: date-time}
        confirmadaPor: {type: [string, 'null'], format: uuid}
        confirmadaEn: {type: [string, 'null'], format: date-time}
    AssetValuationPage:
      type: object
      additionalProperties: false
      required: [elementos, pagina, tamano, hayMas]
      properties:
        elementos: {type: array, items: {$ref: '#/components/schemas/AssetValuation'}}
        pagina: {type: integer, minimum: 0}
        tamano: {type: integer, minimum: 1, maximum: 100}
        hayMas: {type: boolean}
    CreateInventoryAsset:
      type: object
      additionalProperties: false
      required: [codigo, nombre, descripcion, tipo, procesoId, propietarioId]
      properties:
        codigo: {type: string, minLength: 1, maxLength: 80}
        nombre: {type: string, minLength: 1, maxLength: 250}
        descripcion: {type: string, minLength: 1}
        tipo: {type: string, enum: [INFORMACION, HARDWARE, SOFTWARE, SERVICIO, RECURSO_HUMANO, INSTALACION, RED]}
        procesoId: {type: string, format: uuid}
        propietarioId: {type: string, format: uuid}
        custodioId: {type: [string, 'null'], format: uuid}
        ubicacion: {type: [string, 'null'], maxLength: 1000}
    EditInventoryAsset:
      type: object
      additionalProperties: false
      required: [revisionEsperada, nombre, descripcion, tipo, procesoId, propietarioId]
      properties:
        revisionEsperada: {type: integer, format: int64, minimum: 0}
        nombre: {type: string, minLength: 1, maxLength: 250}
        descripcion: {type: string, minLength: 1}
        tipo: {type: string, enum: [INFORMACION, HARDWARE, SOFTWARE, SERVICIO, RECURSO_HUMANO, INSTALACION, RED]}
        procesoId: {type: string, format: uuid}
        propietarioId: {type: string, format: uuid}
        custodioId: {type: [string, 'null'], format: uuid}
        ubicacion: {type: [string, 'null'], maxLength: 1000}
    InventoryAsset:
      type: object
      additionalProperties: false
      required: [activoId, codigo, nombre, descripcion, tipo, procesoId, propietarioId, custodioId, ubicacion, estado, revision, estadoClasificacion]
      properties:
        activoId: {type: string, format: uuid}
        codigo: {type: string, minLength: 1, maxLength: 80}
        nombre: {type: string, minLength: 1, maxLength: 250}
        descripcion: {type: string, minLength: 1}
        tipo: {type: string, enum: [INFORMACION, HARDWARE, SOFTWARE, SERVICIO, RECURSO_HUMANO, INSTALACION, RED]}
        procesoId: {type: string, format: uuid}
        propietarioId: {type: string, format: uuid}
        custodioId: {type: [string, 'null'], format: uuid}
        ubicacion: {type: [string, 'null'], maxLength: 1000}
        estado: {type: string, enum: [ACTIVO, ARCHIVADO]}
        revision: {type: integer, format: int64, minimum: 0}
        estadoClasificacion: {type: string, enum: [PENDIENTE, COMPLETO]}
    ArchiveInventoryAsset:
      type: object
      additionalProperties: false
      required: [revisionEsperada, motivo]
      properties:
        revisionEsperada: {type: integer, format: int64, minimum: 0}
        motivo: {type: string, minLength: 1, maxLength: 1000}
    RestoreInventoryAsset:
      type: object
      additionalProperties: false
      required: [revisionEsperada, motivo]
      properties:
        revisionEsperada: {type: integer, format: int64, minimum: 0}
        motivo: {type: string, minLength: 1, maxLength: 1000}
        referencias: {$ref: '#/components/schemas/InventoryReferences'}
    InventoryReferences:
      type: [object, 'null']
      additionalProperties: false
      required: [procesoId, propietarioId]
      properties:
        procesoId: {type: string, format: uuid}
        propietarioId: {type: string, format: uuid}
        custodioId: {type: [string, 'null'], format: uuid}
    InventoryReferenceChange:
      type: [object, 'null']
      additionalProperties: false
      required: [anteriores, nuevas]
      properties:
        anteriores: {$ref: '#/components/schemas/InventoryReferences'}
        nuevas: {$ref: '#/components/schemas/InventoryReferences'}
    InventoryHistoryEntry:
      type: object
      additionalProperties: false
