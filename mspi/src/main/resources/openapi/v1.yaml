          type: array
          items:
            $ref: '#/components/schemas/CompanyMembership'
        pagina:
          type: integer
          minimum: 0
        tamano:
          type: integer
          minimum: 1
          maximum: 100
        hayMas:
          type: boolean
    CsrfView:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
    LoginInput:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
    SessionView:
      type: object
      additionalProperties: false
      required: [usuarioId, nombreVisible, expiraEn]
      properties:
        usuarioId:
          type: string
          format: uuid
        nombreVisible:
          type: string
        expiraEn:
          type: string
          format: date-time
