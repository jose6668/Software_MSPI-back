        pasoPreparacion: {type: [string, 'null']}
        resultadoPreparacion: {type: [string, 'null']}
        referenciaFallo: {type: [string, 'null'], format: uuid}
        motivoEstado: {type: [string, 'null']}
        invitacionInicialId: {type: [string, 'null'], format: uuid}
    PlatformCompanyPage:
      type: object
