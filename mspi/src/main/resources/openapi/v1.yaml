      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          const: v1
    ApiProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, correlationId, fields]
      properties:
        type:
          type: string
          const: 'about:blank'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
          description: URN con el UUID de correlación
        code:
          type: string
          description: Código estable para consumidores
        correlationId:
          type: string
          format: uuid
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldProblem'
    ApiFieldProblem:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
