openapi: 3.1.0
info:
  title: API MSPI
  version: '1.1.0'
  description: Contrato HTTP inicial. La versión del contrato se puede consultar sin sesión.
paths:
  /api/v1:
    get:
      operationId: consultarVersionApi
      summary: Consulta la versión del contrato
      responses:
        '200':
          description: Versión de la API
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiVersion'
              example:
                version: v1
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    head:
      operationId: consultarCabecerasVersionApi
      summary: Consulta las cabeceras de la versión
      responses:
        '200':
          description: Cabeceras de la respuesta GET
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '406':
          description: Tipo de respuesta no aceptable
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '500':
          description: Error interno
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
  /api/v1/identidad/csrf:
    get:
      operationId: consultarCsrf
      summary: Obtiene un token CSRF vinculado a la sesión del navegador
      responses:
        '200':
          description: Token CSRF. Si aún no hay sesión, el servidor envía MSPISESSION.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfView'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
  /api/v1/identidad/sesion:
    post:
      operationId: iniciarSesion
      summary: Autentica una cuenta local y rota la sesión del navegador
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          $ref: '#/components/responses/CurrentSession'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    get:
      operationId: consultarSesion
      summary: Consulta la identidad de la sesión vigente
      security:
        - sessionCookie: []
      responses:
        '200':
          $ref: '#/components/responses/CurrentSession'
        '401':
          $ref: '#/components/responses/Problem'
        '406':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: cerrarSesion
      summary: Invalida la sesión vigente en el servidor
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Sesión invalidada. El servidor expira la cookie MSPISESSION.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: MSPISESSION
      description: Cookie HttpOnly del servidor. El POST recibe la cookie previa obtenida al consultar CSRF.
  parameters:
    CsrfHeader:
      in: header
      name: X-CSRF-TOKEN
      required: true
      description: Token obtenido con GET /api/v1/identidad/csrf para esta sesión.
      schema:
        type: string
  headers:
    CorrelationId:
      description: UUID generado por el servidor para esta solicitud
      required: true
      schema:
        type: string
        format: uuid
  responses:
    CurrentSession:
      description: Identidad y vencimiento absoluto de la sesión vigente
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SessionView'
    Problem:
      description: Error HTTP con código estable y correlación
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ApiProblem'
  schemas:
    CsrfView:
      type: object
      additionalProperties: false
      required: [headerName, token]
      properties:
        headerName:
          type: string
          const: X-CSRF-TOKEN
        token:
          type: string
    LoginInput:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 1024
    SessionView:
      type: object
      additionalProperties: false
      required: [usuarioId, nombreVisible, expiraEn]
      properties:
        usuarioId:
          type: string
          format: uuid
        nombreVisible:
          type: string
        expiraEn:
          type: string
          format: date-time
    ApiVersion:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version:
          type: string
          const: v1
    ApiProblem:
      type: object
      additionalProperties: false
      required: [type, title, status, detail, instance, code, correlationId, fields]
      properties:
        type:
          type: string
          const: 'about:blank'
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
          description: URN con el UUID de correlación
        code:
          type: string
          description: Código estable para consumidores
        correlationId:
          type: string
          format: uuid
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ApiFieldProblem'
    ApiFieldProblem:
      type: object
      additionalProperties: false
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
