spring:
  application:
    name: mspi
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    read:
      strict-duplicate-detection: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
mspi:
  tenancy:
    enabled: false
