server:
  servlet:
    session:
      timeout: 20m
      tracking-modes: cookie
      cookie:
        name: MSPISESSION
        http-only: true
        secure: true
        same-site: lax
spring:
  application:
    name: mspi
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
    mapper:
      allow-coercion-of-scalars: false
    read:
      strict-duplicate-detection: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
mspi:
  identity:
    session-lifetime: 8h
    attempt-window: 1m
    attempts-per-account: 5
    attempts-per-address: 30
    total-attempts: 120
    concurrent-checks: 4
  tenancy:
    enabled: false
