server:
  forward-headers-strategy: none
  max-http-request-header-size: 8KB
  tomcat:
    threads:
      max: 64
      min-spare: 4
    max-connections: 128
    accept-count: 32
    connection-timeout: 5s
    keep-alive-timeout: 5s
    max-keep-alive-requests: 100
    max-swallow-size: 64KB
    max-part-count: 4
    max-http-form-post-size: 64KB
  servlet:
    session:
      timeout: 20m
      tracking-modes: cookie
      cookie:
        name: MSPISESSION
        http-only: true
        secure: true
        same-site: lax
spring:
  servlet:
    multipart:
      max-file-size: 10000000B
      max-request-size: 10016384B
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.checkserveridentity]": true
  application:
    name: mspi
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
    read:
      strict-duplicate-detection: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
logging:
  level:
    org.apache.pdfbox: OFF
management:
  health:
    mail:
      enabled: false
mspi:
  load:
    window: 1m
    requests-per-address: 1200
    tracked-addresses: 1024
    concurrent-requests: 32
    concurrent-evidence: 2
    max-sessions: 256
    json-bytes: 65536
    multipart-bytes: 10016384
  evidence:
    enabled: false
  invitations:
    enabled: false
  recovery:
    enabled: false
  identity:
    session-lifetime: 8h
    attempt-window: 1m
    attempts-per-account: 5
    attempts-per-address: 30
    total-attempts: 120
    concurrent-checks: 4
  tenancy:
    enabled: false
