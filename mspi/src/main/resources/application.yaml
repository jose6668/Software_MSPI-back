server:
  servlet:
    session:
      timeout: 20m
      tracking-modes: cookie
      cookie:
        name: MSPISESSION
        http-only: true
        secure: true
        same-site: lax
spring:
  mail:
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
      "[mail.smtp.starttls.enable]": true
      "[mail.smtp.starttls.required]": true
      "[mail.smtp.ssl.checkserveridentity]": true
  application:
    name: mspi
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-trailing-tokens: true
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    mapper:
      allow-coercion-of-scalars: false
    read:
      strict-duplicate-detection: true
  flyway:
    enabled: false
  sql:
    init:
      mode: never
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
management:
  health:
    mail:
      enabled: false
mspi:
  invitations:
    enabled: false
  identity:
    session-lifetime: 8h
    attempt-window: 1m
    attempts-per-account: 5
    attempts-per-address: 30
    total-attempts: 120
    concurrent-checks: 4
  tenancy:
    enabled: false
