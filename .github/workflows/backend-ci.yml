name: Backend CI

on:
  pull_request:
    branches: [Develop]
  push:
    branches: [Develop]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 17 / PostgreSQL
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mspi
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: mspi/pom.xml

      - name: Check Java, Maven wrapper and Docker
        run: |
          java -version
          bash ./mvnw --version
          docker info

      - name: Test recovery archive safeguards
        working-directory: .
        run: python3 -m unittest discover -s scripts/recovery

      - name: Generate disposable TLS material outside the checkout
        shell: pwsh
        working-directory: .
        run: |
          $lan = [Net.NetworkInformation.NetworkInterface]::GetAllNetworkInterfaces() |
            ForEach-Object { $_.GetIPProperties().UnicastAddresses } |
            Where-Object { $_.Address.AddressFamily -eq 'InterNetwork' -and
              ($_.Address.IPAddressToString -match '^(10\.|192\.168\.|172\.(1[6-9]|2[0-9]|3[01])\.)') } |
            Select-Object -First 1
          if (-not $lan) { throw 'The LAN TLS test requires a private IPv4 address.' }
          $directory = Join-Path $env:RUNNER_TEMP 'mspi-tls-material'
          ./scripts/https/New-MspiTlsMaterial.ps1 -OutputDirectory $directory -LanAddress $lan.Address.IPAddressToString | Out-Null
          $mode = & stat -c '%a' $directory
          if ($mode -ne '700') { throw 'TLS directory permissions are not private.' }
          $rejected = $false
          try { ./scripts/https/New-MspiTlsMaterial.ps1 -OutputDirectory (Join-Path $env:GITHUB_WORKSPACE '.security-reports/forbidden-tls') }
          catch { $rejected = $_.Exception.Message -like '*fuera de cualquier repositorio Git*' }
          if (-not $rejected) { throw 'The generator allowed TLS material inside Git.' }
          $target = Join-Path $env:RUNNER_TEMP 'mspi-tls-link-target'
          New-Item -ItemType Directory -Path $target | Out-Null
          $link = Join-Path $env:RUNNER_TEMP 'mspi-tls-link'
          New-Item -ItemType SymbolicLink -Path $link -Target $target | Out-Null
          $rejected = $false
          try { ./scripts/https/New-MspiTlsMaterial.ps1 -OutputDirectory (Join-Path $link 'forbidden-tls') }
          catch { $rejected = $_.Exception.Message -like '*enlaces o junctions*' }
          if (-not $rejected) { throw 'The generator allowed an indirect TLS destination.' }
          "MSPI_TEST_TLS_DIRECTORY=$directory" >> $env:GITHUB_ENV
          "MSPI_TEST_TLS_LAN_ADDRESS=$($lan.Address.IPAddressToString)" >> $env:GITHUB_ENV

      - name: Compile, test with PostgreSQL and package
        run: bash ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Verify isolated CPU memory and temporary-disk limits
        working-directory: .
        run: python3 scripts/resources/test_container_budget.py

      - name: Export resolved Maven dependencies
        run: |
          bash ./mvnw --batch-mode --no-transfer-progress \
            org.apache.maven.plugins:maven-dependency-plugin:3.10.0:tree \
            -DoutputType=json -DoutputFile=target/dependencies.json

      - name: Check Maven and deployment images for vulnerabilities
        working-directory: .
        run: |
          tool="$RUNNER_TEMP/mspi-trivy"
          mkdir -p "$tool"
          curl --fail --silent --show-error --location --retry 2 --max-time 120 \
            https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz \
            -o "$tool/trivy.tar.gz"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$tool/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$tool/trivy.tar.gz" -C "$tool" trivy
          python3 -m unittest discover -s .github/scripts -p test_check_vulnerabilities.py
          python3 .github/scripts/check_vulnerabilities.py \
            --maven-tree mspi/target/dependencies.json --trivy "$tool/trivy" \
            --reports "$RUNNER_TEMP/mspi-vulnerabilities" --cache "$tool/cache"

      - name: Upload vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vulnerability-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mspi-vulnerabilities/
          retention-days: 7
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: mspi/target/surefire-reports/
          if-no-files-found: warn
